# Nginx-instelling voor mijnrecepten.lab023.nl.
# Plaats dit als /etc/nginx/sites-available/mijnrecepten en activeer met een
# symlink naar sites-enabled. Stel daarna HTTPS in met Certbot.
#
# Deze pagina stuurt door naar de MijnRecepten-backend (container mijnrecepten)
# die op deze server op poort 8300 luistert (alleen op localhost).
#
# Afscherming alleen op het beheer:
#   Het snippet snippets/lab023-login.conf zet `auth_request` op serverniveau
#   (alles afgeschermd) en levert de bijbehorende /oauth2/auth- en
#   @lab023_login-locaties. Dat snippet kan daarom NIET in een location-blok
#   staan (geneste locaties werken niet). De opzet is dus omgekeerd: het snippet
#   staat op serverniveau, en de publieke delen worden weer opengezet met
#   `auth_request off;`. Zo blijven de recepten vrij te bekijken en is alleen
#   het beheer afgeschermd via de centrale aanmelding (oauth2-proxy, mijnlogin).
#
# Let op: Certbot bouwt dit bestand om naar een 443-blok met certificaatregels.
# De include-regel hoort in dat 443-blok te blijven staan.

server {
    listen 80;
    server_name mijnrecepten.lab023.nl;

    # Centrale aanmelding: standaard is alles afgeschermd.
    include snippets/lab023-login.conf;

    # Publiek: recepten bekijken, de lees-API en de foto's (geen inlog).
    # De pagina, de stijl- en scriptbestanden en de foto's vallen hier ook onder.
    location / {
        auth_request off;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Afgeschermd: de beheerpagina (erft auth_request van serverniveau).
    location /beheer {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Afgeschermd: alle schrijf-acties (toevoegen, wijzigen, verwijderen, OCR).
    location /api/beheer/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
