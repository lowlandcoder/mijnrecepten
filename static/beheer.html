<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061225">
  <meta name="robots" content="noindex">
  <title>MijnRecepten — Beheer</title>
  <link rel="stylesheet" href="/huisstijl.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/beheer.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 class="merk">Mijn<em>Recepten</em> · beheer</h1>
        <div class="merk-sub" id="status">Overzicht van alle recepten.</div>
      </div>
      <div class="kop-knoppen">
        <a class="beheer-knop" href="/">Naar de site</a>
        <a class="knop-link" href="/beheer/toevoegen">+ Recept toevoegen</a>
      </div>
    </header>

    <div class="tabs" id="beheerTabs">
      <button class="tab actief" data-categorie="">Alles</button>
      <button class="tab" data-categorie="favoriet">Favoriet</button>
      <button class="tab" data-categorie="uitproberen">Uitproberen</button>
      <button class="tab" data-categorie="afgeserveerd">Afgeserveerd</button>
    </div>

    <div class="zoekbalk">
      <svg class="zoek-icoon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="zoekveld" type="text" placeholder="Zoek in titel, ingrediënten…" autocomplete="off" aria-label="Zoek een recept">
    </div>

    <div class="labels" id="labels" aria-label="Filter op ingrediënt"></div>

    <div id="beheerLijst" class="beheer-lijst"></div>
  </main>

  <script src="/beheer.js"></script>
</body>
</html>
